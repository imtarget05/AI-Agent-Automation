x-llm-environment: &llm-environment
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o}
  REASONING_MODEL: ${REASONING_MODEL:-}
  FALLBACK_MODEL: ${FALLBACK_MODEL:-claude-sonnet-4-5}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  OLLAMA_ENABLED: ${OLLAMA_ENABLED:-false}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:8b}
  OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
  OLLAMA_TASK_TYPES: '${OLLAMA_TASK_TYPES:-["classification","summarize","parsing","draft","report_draft"]}'
  MONITORING_SERVICE_URL: http://monitoring:8005
  SANDBOX_DEMO_MODE: ${SANDBOX_DEMO_MODE:-false}
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
  QDRANT_API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-in-prod}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-ai-agent-automation}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel_collector:4317}
  OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-otlp}
  OTEL_LOG_LEVEL: ${OTEL_LOG_LEVEL:-INFO}
  MAX_TOKENS_PER_REQUEST: ${MAX_TOKENS_PER_REQUEST:-20000}
  MAX_TOKENS_PER_WORKFLOW: ${MAX_TOKENS_PER_WORKFLOW:-80000}
  MAX_LLM_CALLS_PER_WORKFLOW: ${MAX_LLM_CALLS_PER_WORKFLOW:-20}
  MAX_COST_PER_WORKFLOW_USD: ${MAX_COST_PER_WORKFLOW_USD:-2.00}
  MAX_COST_PER_USER_DAILY_USD: ${MAX_COST_PER_USER_DAILY_USD:-10.00}

services:
  # ──── Infrastructure ────
  postgres:
    image: postgres:16-alpine
    container_name: agent_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-postgres-password-change-in-prod}
      POSTGRES_DB: agent_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agent_redis
    expose:
      - "6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-dev-redis-password-change-in-prod}
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-dev-redis-password-change-in-prod}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent_qdrant
    expose:
      - "6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-dev-qdrant-key-change-in-prod}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel_collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:latest
    container_name: ai-agent-automation-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:latest
    container_name: agent_jaeger
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:14250:14250"

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:latest
    container_name: agent_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:latest
    container_name: agent_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  ollama:
    profiles: ["gpu"]
    image: ollama/ollama:latest
    container_name: agent_ollama
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c", "ollama serve & sleep 5 && ollama pull deepseek-r1:8b && wait"]

  n8n:
    profiles: ["workflows"]
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: agent_n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_METRICS=true
      - N8N_DIAGNOSTICS_ENABLED=false
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  # ──── Core Platform Services ────
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      target: gateway
    container_name: agent_gateway
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-dev-postgres-password-change-in-prod}@postgres:5432/agent_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-in-prod}@redis:6379
      QDRANT_URL: http://qdrant:6333
      API_SECRET_KEY: ${API_SECRET_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GUARDRAIL_SERVICE_URL: http://guardrail_service:8010
      APPROVAL_SERVICE_URL: http://approval_service:8011
      REPORT_AGENT_SERVICE_URL: http://report_agent:8012
      AIOPS_AGENT_SERVICE_URL: http://aiops_agent:8013
      RCA_AGENT_SERVICE_URL: http://rca_agent:8014
      DEVOPS_AGENT_SERVICE_URL: http://devops_agent:8015
      AGENTSCOPE_AGENT_SERVICE_URL: http://agentscope_agent:8017
      AGENTSCOPE_ENABLED: ${AGENTSCOPE_ENABLED:-false}
      CLAW_ENABLED: ${CLAW_ENABLED:-false}
      CLAW_BINARY_PATH: ${CLAW_BINARY_PATH:-}
      CLAW_WORKING_DIRECTORY: ${CLAW_WORKING_DIRECTORY:-}
      CLAW_TIMEOUT_SECONDS: ${CLAW_TIMEOUT_SECONDS:-300}
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_SERVERS: '${MCP_SERVERS:-{}}'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  monitoring:
    build:
      context: .
      dockerfile: Dockerfile
      target: monitoring
    container_name: agent_monitoring
    expose:
      - "8005"
    environment:
      ENV: ${ENV:-development}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      MONITORING_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-dev-postgres-password-change-in-prod}@postgres:5432/agent_db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    container_name: agent_dashboard
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:8006:8006"
    environment:
      ENV: ${ENV:-development}
      MONITORING_URL: http://monitoring:8005
      DASHBOARD_GATEWAY_URL: ${DASHBOARD_GATEWAY_URL:-http://localhost:8000}
    depends_on:
      - monitoring
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──── AIOps & Platform Agents ────
  aiops_agent:
    build: { context: ., dockerfile: Dockerfile, target: aiops_agent }
    container_name: agent_aiops_agent
    expose: ["8013"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      TOOL_SERVICE_URL: http://tool_service:8008
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8013/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  rca_agent:
    build: { context: ., dockerfile: Dockerfile, target: rca_agent }
    container_name: agent_rca_agent
    expose: ["8014"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RAG_SERVICE_URL: http://rag_service:8007
      TOOL_SERVICE_URL: http://tool_service:8008
      RCA_MAX_REASONING_STEPS: ${RCA_MAX_REASONING_STEPS:-5}
      ACCURACY_GUARDRAIL_ENABLED: ${ACCURACY_GUARDRAIL_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8014/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  devops_agent:
    build: { context: ., dockerfile: Dockerfile, target: devops_agent }
    container_name: agent_devops_agent
    expose: ["8015"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8015/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  report_agent:
    build: { context: ., dockerfile: Dockerfile, target: report_agent }
    container_name: agent_report_agent
    expose: ["8012"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  agentscope_agent:
    profiles: ["agentscope"]
    build: { context: ., dockerfile: Dockerfile, target: agentscope_agent }
    container_name: agent_agentscope_agent
    expose: ["8017"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AGENTSCOPE_ENABLED: ${AGENTSCOPE_ENABLED:-false}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8017/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  email_agent:
    build: { context: ., dockerfile: Dockerfile, target: email_agent }
    container_name: agent_email_agent
    expose: ["8009"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      TOOL_SERVICE_URL: http://tool_service:8008
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──── Platform Infrastructure Services ────
  rag_service:
    build: { context: ., dockerfile: Dockerfile, target: rag_service }
    container_name: agent_rag_service
    expose: ["8007"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      QDRANT_URL: http://qdrant:6333
      RAG_COLLECTION: ${RAG_COLLECTION:-rag_documents}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-800}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      RAG_DEFAULT_TOP_K: ${RAG_DEFAULT_TOP_K:-5}
      RAG_DOCS_PATH: ${RAG_DOCS_PATH:-docs}
      RAG_VERIFICATION_ENABLED: ${RAG_VERIFICATION_ENABLED:-true}
      RAG_GRADING_THRESHOLD: ${RAG_GRADING_THRESHOLD:-0.7}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  tool_service:
    build: { context: ., dockerfile: Dockerfile, target: tool_service }
    container_name: agent_tool_service
    expose: ["8008"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GUARDRAIL_SERVICE_URL: http://guardrail_service:8010
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  guardrail_service:
    build: { context: ., dockerfile: Dockerfile, target: guardrail_service }
    container_name: agent_guardrail_service
    expose: ["8010"]
    environment:
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  approval_service:
    build: { context: ., dockerfile: Dockerfile, target: approval_service }
    container_name: agent_approval_service
    expose: ["8011"]
    environment:
      ENV: ${ENV:-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    volumes:
      - approval_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  eval_service:
    build: { context: ., dockerfile: Dockerfile, target: eval_service }
    container_name: agent_eval_service
    expose: ["8016"]
    environment:
      ENV: ${ENV:-development}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-service-token-change-in-prod}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8016/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ──── Legacy Personal Agents ────
  social:
    build: { context: ., dockerfile: Dockerfile, target: social }
    container_name: agent_social
    ports: ["${SOCIAL_BIND_ADDRESS:-127.0.0.1}:8002:8002"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      REDIS_URL: redis://:${REDIS_PASSWORD:-dev-redis-password-change-in-prod}@redis:6379
      QDRANT_URL: http://qdrant:6333
      FB_PAGE_TOKEN: ${FB_PAGE_TOKEN:-}
      FB_VERIFY_TOKEN: ${FB_VERIFY_TOKEN:-my_webhook_secret}
      FB_APP_SECRET: ${FB_APP_SECRET:-}
      ZALO_OA_TOKEN: ${ZALO_OA_TOKEN:-}
      ZALO_SERVER_KEY: ${ZALO_SERVER_KEY:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  browser:
    build: { context: ., dockerfile: Dockerfile, target: browser }
    container_name: agent_browser
    expose: ["8003"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  computer_use:
    profiles: ["unsafe-computer-use"]
    build: { context: ., dockerfile: Dockerfile, target: computer_use }
    container_name: agent_computer_use
    expose: ["8004"]
    environment:
      <<: *llm-environment
      ENV: ${ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DISPLAY: ${DISPLAY:-:0}
    volumes: ["/tmp/.X11-unix:/tmp/.X11-unix:rw"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  custom_ui:
    profiles: ["custom-ui"]
    build:
      context: .
      dockerfile: Dockerfile
      target: custom_ui
    container_name: agent_custom_ui
    ports:
      - "${CUSTOM_UI_BIND_ADDRESS:-127.0.0.1}:8001:8001"
    environment:
      ENV: ${ENV:-development}
      GATEWAY_URL: http://gateway:8000/execute
      API_SECRET_KEY: ${API_SECRET_KEY}
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  n8n_data:
  approval_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: agent_network
