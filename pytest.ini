[pytest]
testpaths = tests
pythonpath = .
addopts = -m "not smoke and not production"
asyncio_mode = auto
markers =
    smoke: Smoke tests — require live gateway (auto-skipped when not reachable)
    production: Production verification tests — require live gateway (auto-skipped when not reachable)
    unit: Pure unit tests with no external dependencies
    integration: Integration tests with mocked external services
    asyncio: Async tests (pytest-asyncio)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
