name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-agent

jobs:
  quality:
    name: "🔍 Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install linting tools
        run: |
          pip install ruff mypy

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy type check
        run: mypy --ignore-missing-imports .

  security:
    name: "🔒 Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      - name: Bandit SAST scan
        run: bandit -r . -ll

      - name: Pip-audit dependency scan
        run: pip-audit

  test:
    name: "🧪 Unit Tests"
    runs-on: ubuntu-latest
    needs: [quality, security]
    
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx aioredis qdrant-client

      - name: Run tests with coverage
        env:
          ENV: testing
          REDIS_URL: redis://localhost:6379
          API_SECRET_KEY: test-secret-key
          OPENAI_API_KEY: sk-test-dummy
          ANTHROPIC_API_KEY: sk-ant-test-dummy
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          QDRANT_URL: http://localhost:6333
          MONITORING_DATABASE_URL: sqlite:///./metrics_test.db
        run: |
          pytest tests/ -m "not smoke" -v --cov=. --cov-report=term-missing

  build:
    name: "🐳 Build & Push Images"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - gateway
          - aiops_agent
          - rca_agent
          - devops_agent
          - report_agent
          - email_agent
          - guardrail_service
          - approval_service
          - rag_service
          - eval_service
          - tool_service
          - monitoring
          - dashboard

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=true

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
