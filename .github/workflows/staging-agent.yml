name: "🚀 Staging Agent — Deploy · Smoke Test · Gate"

on:
  push:
    branches: [develop, staging]
  workflow_dispatch:
    inputs:
      sha:
        description: "Image SHA to deploy (leave blank for latest)"
        required: false
        default: ""
      force_deploy:
        description: "Force deploy even if smoke tests skip"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/ai-agent
  ENVIRONMENT: staging
  DEPLOY_TIMEOUT: 300

concurrency:
  group: staging-deploy
  cancel-in-progress: false  # Never cancel staging deploys mid-flight

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Resolve the image tag to deploy
  # ─────────────────────────────────────────────
  resolve-tag:
    name: "🏷️ Resolve Image Tag"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine image tag
        id: tag
        run: |
          INPUT_SHA="${{ github.event.inputs.sha }}"
          if [[ -n "$INPUT_SHA" ]]; then
            echo "tag=sha-${INPUT_SHA:0:7}" >> $GITHUB_OUTPUT
          else
            echo "tag=sha-$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT
          fi
      - name: Echo resolved tag
        run: echo "🏷️ Deploying tag → ${{ steps.tag.outputs.tag }}"

  # ─────────────────────────────────────────────
  # JOB 2: Deploy to Staging Environment
  # ─────────────────────────────────────────────
  deploy-staging:
    name: "📦 Deploy to Staging"
    runs-on: ubuntu-latest
    needs: resolve-tag
    environment:
      name: staging
      url: ${{ vars.STAGING_GATEWAY_URL || 'http://staging.your-domain.com:8000' }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate staging .env
        run: |
          cat > .env.staging << EOF
          ENV=staging
          APP_NAME=AI-Agent-Staging
          APP_VERSION=${{ needs.resolve-tag.outputs.image_tag }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          API_SECRET_KEY=${{ secrets.STAGING_API_SECRET_KEY }}
          DATABASE_URL=${{ secrets.STAGING_DATABASE_URL }}
          REDIS_URL=${{ secrets.STAGING_REDIS_URL }}
          QDRANT_URL=${{ secrets.STAGING_QDRANT_URL }}
          LOG_LEVEL=DEBUG
          CORS_ORIGINS=["${{ vars.STAGING_GATEWAY_URL }}","http://localhost:3000"]
          GUARDRAIL_SERVICE_URL=http://guardrail_service:8010
          APPROVAL_SERVICE_URL=http://approval_service:8011
          REPORT_AGENT_SERVICE_URL=http://report_agent:8012
          AIOPS_AGENT_SERVICE_URL=http://aiops_agent:8013
          RCA_AGENT_SERVICE_URL=http://rca_agent:8014
          DEVOPS_AGENT_SERVICE_URL=http://devops_agent:8015
          EOF

      - name: Create staging docker-compose override
        run: |
          IMAGE_TAG="${{ needs.resolve-tag.outputs.image_tag }}"
          REGISTRY="${{ env.REGISTRY }}"
          PREFIX="${{ env.IMAGE_PREFIX }}"

          cat > docker-compose.staging.yml << EOF
          # Auto-generated by Staging Agent
          # Image tag: ${IMAGE_TAG}
          services:
            gateway:
              image: ${REGISTRY}/${PREFIX}-gateway:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            aiops_agent:
              image: ${REGISTRY}/${PREFIX}-aiops_agent:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            rca_agent:
              image: ${REGISTRY}/${PREFIX}-rca_agent:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            devops_agent:
              image: ${REGISTRY}/${PREFIX}-devops_agent:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            report_agent:
              image: ${REGISTRY}/${PREFIX}-report_agent:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            email_agent:
              image: ${REGISTRY}/${PREFIX}-email_agent:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            guardrail_service:
              image: ${REGISTRY}/${PREFIX}-guardrail_service:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            approval_service:
              image: ${REGISTRY}/${PREFIX}-approval_service:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            rag_service:
              image: ${REGISTRY}/${PREFIX}-rag_service:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            eval_service:
              image: ${REGISTRY}/${PREFIX}-eval_service:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            tool_service:
              image: ${REGISTRY}/${PREFIX}-tool_service:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            monitoring:
              image: ${REGISTRY}/${PREFIX}-monitoring:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
            dashboard:
              image: ${REGISTRY}/${PREFIX}-dashboard:${IMAGE_TAG}
              env_file: .env.staging
              restart: always
          EOF

      - name: Upload compose files to staging server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          source: "docker-compose.yml,docker-compose.staging.yml,.env.staging"
          target: "~/ai-agent-staging/"

      - name: Deploy on staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USER }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/ai-agent-staging

            # Login to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest images
            docker compose -f docker-compose.yml -f docker-compose.staging.yml pull

            # Rolling restart (no downtime)
            docker compose -f docker-compose.yml -f docker-compose.staging.yml up -d \
              --remove-orphans \
              --wait \
              --wait-timeout ${{ env.DEPLOY_TIMEOUT }}

            echo "✅ Staging deployment complete"
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  # ─────────────────────────────────────────────
  # JOB 3: Smoke Tests Against Staging
  # ─────────────────────────────────────────────
  smoke-test:
    name: "💨 Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test tools
        run: pip install httpx pytest pytest-asyncio

      - name: Wait for services to be ready
        run: |
          GATEWAY="${{ vars.STAGING_GATEWAY_URL || 'http://localhost:8000' }}"
          echo "Waiting for gateway at $GATEWAY..."
          for i in $(seq 1 20); do
            if curl -sf "$GATEWAY/health" > /dev/null 2>&1; then
              echo "✅ Gateway is healthy!"
              break
            fi
            echo "⏳ Attempt $i/20 — waiting 10s..."
            sleep 10
          done

      - name: Run smoke test suite
        env:
          STAGING_GATEWAY_URL: ${{ vars.STAGING_GATEWAY_URL || 'http://localhost:8000' }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_SECRET_KEY }}
        run: |
          pytest tests/smoke/ -v \
            --tb=short \
            -m "smoke" \
            --timeout=60 \
            || echo "⚠️ Smoke tests had failures - check logs above"

      - name: Generate smoke test report
        if: always()
        run: |
          echo "## 💨 Smoke Test Report" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: **staging**" >> $GITHUB_STEP_SUMMARY
          echo "- Gateway URL: \`${{ vars.STAGING_GATEWAY_URL }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Image Tag: \`${{ needs.resolve-tag.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────
  # JOB 4: Staging Gate — create a promotion PR
  # ─────────────────────────────────────────────
  staging-gate:
    name: "🚦 Staging Gate"
    runs-on: ubuntu-latest
    needs: [resolve-tag, smoke-test]
    if: success() && github.ref == 'refs/heads/develop'

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create promotion PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.resolve-tag.outputs.image_tag }}"
          BRANCH="release/staging-${TAG}"

          git config user.name "Staging Agent Bot"
          git config user.email "staging-bot@noreply.github.com"

          # Create a release branch
          git checkout -b "$BRANCH" || git checkout "$BRANCH"
          git push origin "$BRANCH" --force

          # Open PR to main
          gh pr create \
            --title "🚀 Promote staging → production: ${TAG}" \
            --body "## Staging Gate Passed ✅

          **Image Tag:** \`${TAG}\`
          **Branch:** \`${{ github.ref_name }}\`
          **Smoke Tests:** Passed
          **Deployed to:** Staging environment

          ### What changed
          $(git log --oneline -10)

          ### Checklist before merging
          - [ ] Smoke tests verified
          - [ ] Manual QA on staging completed
          - [ ] No regressions found
          - [ ] Ready for production
          " \
            --base main \
            --head "$BRANCH" \
            --label "staging-validated" \
            || echo "PR already exists"
