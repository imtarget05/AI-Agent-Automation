global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel_collector:8888'] # OTel collector self-metrics

  - job_name: 'ai-agent-services'
    static_configs:
      - targets: ['otel_collector:8889'] # Metrics exported from services via OTel collector
