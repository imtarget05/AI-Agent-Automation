<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Playground</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #212121;
            --panel: #171717;
            --panel-soft: #262626;
            --surface: #303030;
            --surface-hover: #383838;
            --border: #3a3a3a;
            --border-soft: #2c2c2c;
            --text: #ececec;
            --muted: #a4a4a4;
            --muted-strong: #c7c7c7;
            --accent: #10a37f;
            --accent-hover: #0d8c6e;
            --danger: #f87171;
            --warning: #fbbf24;
            --code: #151515;
            --sidebar-width: 268px;
            --inspector-width: 330px;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
        }

        button,
        input,
        textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .app-shell {
            display: grid;
            grid-template-columns: var(--sidebar-width) minmax(0, 1fr) var(--inspector-width);
            height: 100vh;
        }

        .sidebar,
        .inspector {
            background: var(--panel);
        }

        .sidebar {
            display: flex;
            min-width: 0;
            flex-direction: column;
            border-right: 1px solid var(--border-soft);
        }

        .sidebar-header {
            padding: 14px 12px 10px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 4px 14px;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
        }

        .brand-mark {
            display: grid;
            width: 28px;
            height: 28px;
            place-items: center;
            border-radius: 10px;
            background: var(--text);
            color: #171717;
            font-size: 13px;
            font-weight: 800;
        }

        .new-chat,
        .sidebar-action,
        .icon-button,
        .secondary-button,
        .primary-button,
        .approval-button {
            border: 0;
            border-radius: 8px;
            color: var(--text);
            transition: background 150ms ease, border-color 150ms ease, opacity 150ms ease;
        }

        .new-chat {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 10px;
            padding: 10px 11px;
            background: transparent;
            text-align: left;
        }

        .new-chat:hover,
        .sidebar-action:hover,
        .session-item:hover,
        .icon-button:hover {
            background: var(--surface-hover);
        }

        .plus {
            color: var(--muted-strong);
            font-size: 20px;
            line-height: 1;
        }

        .search-wrap {
            padding: 0 12px 8px;
        }

        .search-input,
        .settings-input {
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            outline: 0;
            background: #202020;
            color: var(--text);
        }

        .search-input {
            padding: 8px 10px;
            font-size: 12px;
        }

        .search-input:focus,
        .settings-input:focus,
        .composer:focus {
            border-color: #606060;
        }

        .history-label,
        .inspector-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .history-label {
            padding: 9px 16px 6px;
        }

        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .session-item {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 4px;
            margin: 1px 0;
            border-radius: 8px;
            background: transparent;
        }

        .session-item.active {
            background: var(--surface);
        }

        .session-select {
            min-width: 0;
            flex: 1;
            border: 0;
            background: transparent;
            color: var(--text);
            padding: 9px 8px;
            overflow: hidden;
            text-align: left;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-delete {
            display: none;
            width: 28px;
            height: 28px;
            margin-right: 4px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--muted);
        }

        .session-item:hover .session-delete,
        .session-item.active .session-delete {
            display: block;
        }

        .session-delete:hover {
            background: #454545;
            color: var(--text);
        }

        .sidebar-footer {
            border-top: 1px solid var(--border-soft);
            padding: 8px;
        }

        .sidebar-action {
            display: flex;
            width: 100%;
            align-items: center;
            gap: 9px;
            padding: 9px 8px;
            background: transparent;
            text-align: left;
        }

        .settings-panel {
            display: none;
            gap: 8px;
            padding: 9px 4px 3px;
        }

        .settings-panel.open {
            display: grid;
        }

        .settings-label {
            color: var(--muted);
            font-size: 11px;
            font-weight: 650;
        }

        .settings-input {
            padding: 8px 9px;
            font-size: 12px;
        }

        .key-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 6px;
        }

        .key-toggle {
            width: 35px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #202020;
            color: var(--muted-strong);
            font-size: 11px;
        }

        .remember-row {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted-strong);
            font-size: 11px;
        }

        .settings-actions {
            display: flex;
            gap: 6px;
        }

        .secondary-button,
        .primary-button {
            padding: 8px 10px;
            font-size: 12px;
            font-weight: 650;
        }

        .secondary-button {
            background: var(--surface);
        }

        .secondary-button:hover {
            background: var(--surface-hover);
        }

        .primary-button,
        .approval-button {
            background: var(--accent);
        }

        .primary-button:hover,
        .approval-button:hover {
            background: var(--accent-hover);
        }

        .main {
            display: flex;
            min-width: 0;
            flex-direction: column;
            background: var(--bg);
        }

        .chat-header {
            display: flex;
            min-height: 58px;
            align-items: center;
            gap: 12px;
            padding: 8px 16px;
            border-bottom: 1px solid var(--border-soft);
        }

        .header-title {
            min-width: 0;
            flex: 1;
        }

        .chat-title {
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .session-id {
            margin-top: 2px;
            color: var(--muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 11px;
        }

        .gateway-pill {
            display: flex;
            align-items: center;
            gap: 7px;
            color: var(--muted-strong);
            font-size: 12px;
        }

        .health-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: #737373;
        }

        .health-dot.online {
            background: var(--accent);
        }

        .health-dot.offline {
            background: var(--danger);
        }

        .icon-button {
            display: grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border: 0;
            background: transparent;
            color: var(--muted-strong);
        }

        .mobile-only {
            display: none;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            width: min(820px, 100%);
            margin: 0 auto;
            padding: 17px 22px;
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message-content {
            min-width: 0;
            max-width: 100%;
            color: var(--text);
            line-height: 1.65;
        }

        .user .message-content {
            max-width: min(78%, 680px);
            border-radius: 18px;
            background: var(--surface);
            padding: 10px 15px;
            white-space: pre-wrap;
        }

        .system .message-content {
            color: var(--muted-strong);
            font-size: 12px;
        }

        .error .message-content {
            border: 1px solid rgba(248, 113, 113, 0.45);
            border-radius: 10px;
            background: rgba(127, 29, 29, 0.2);
            padding: 11px 13px;
            color: #fecaca;
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            color: var(--muted);
            font-size: 11px;
        }

        .message-meta strong {
            color: var(--muted-strong);
            font-weight: 650;
        }

        .markdown > :first-child {
            margin-top: 0;
        }

        .markdown > :last-child {
            margin-bottom: 0;
        }

        .markdown p,
        .markdown ul,
        .markdown ol,
        .markdown blockquote,
        .markdown pre {
            margin: 0 0 12px;
        }

        .markdown h1,
        .markdown h2,
        .markdown h3,
        .markdown h4 {
            margin: 19px 0 8px;
            color: #f5f5f5;
            line-height: 1.3;
        }

        .markdown h1 {
            font-size: 20px;
        }

        .markdown h2 {
            font-size: 18px;
        }

        .markdown h3,
        .markdown h4 {
            font-size: 15px;
        }

        .markdown ul,
        .markdown ol {
            padding-left: 22px;
        }

        .markdown li {
            margin: 3px 0;
        }

        .markdown blockquote {
            border-left: 3px solid #646464;
            padding-left: 11px;
            color: var(--muted-strong);
        }

        .markdown a {
            color: #7dd3fc;
            text-underline-offset: 2px;
        }

        .markdown code {
            border-radius: 4px;
            background: var(--code);
            padding: 2px 5px;
            color: #d4d4d4;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.9em;
        }

        .markdown pre {
            overflow-x: auto;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background: var(--code);
            padding: 12px;
        }

        .markdown pre code {
            padding: 0;
        }

        .markdown hr {
            border: 0;
            border-top: 1px solid var(--border);
            margin: 16px 0;
        }

        .empty-state {
            display: grid;
            min-height: 100%;
            place-items: center;
            padding: 40px 24px;
        }

        .empty-inner {
            width: min(660px, 100%);
            text-align: center;
        }

        .empty-mark {
            display: grid;
            width: 48px;
            height: 48px;
            place-items: center;
            margin: 0 auto 15px;
            border-radius: 16px;
            background: var(--text);
            color: #171717;
            font-weight: 800;
        }

        .empty-title {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
        }

        .empty-copy {
            margin: 8px auto 19px;
            color: var(--muted);
            line-height: 1.5;
        }

        .examples {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .example {
            border: 1px solid var(--border);
            border-radius: 10px;
            background: transparent;
            color: var(--muted-strong);
            padding: 11px 12px;
            text-align: left;
        }

        .example:hover {
            background: var(--surface);
            color: var(--text);
        }

        .loading-row {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--muted-strong);
        }

        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px;
            height: 6px;
            border-radius: 999px;
            background: var(--muted);
            animation: pulse 1.2s infinite ease-in-out;
        }

        .loading-dots span:nth-child(2) {
            animation-delay: 150ms;
        }

        .loading-dots span:nth-child(3) {
            animation-delay: 300ms;
        }

        @keyframes pulse {
            0%,
            70%,
            100% {
                opacity: 0.3;
                transform: translateY(0);
            }
            35% {
                opacity: 1;
                transform: translateY(-2px);
            }
        }

        .approval-card {
            margin-top: 14px;
            border: 1px solid rgba(251, 191, 36, 0.45);
            border-radius: 10px;
            background: rgba(120, 53, 15, 0.16);
            padding: 12px;
        }

        .approval-title {
            color: #fde68a;
            font-size: 13px;
            font-weight: 700;
        }

        .approval-copy {
            margin: 4px 0 10px;
            color: #e5d5a8;
            font-size: 12px;
        }

        .approval-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 7px;
        }

        .approval-button {
            padding: 7px 9px;
            color: white;
            font-size: 12px;
            font-weight: 700;
        }

        .approval-button[disabled] {
            cursor: default;
            opacity: 0.5;
        }

        .composer-wrap {
            padding: 12px 18px 14px;
        }

        .composer-box {
            width: min(820px, 100%);
            margin: 0 auto;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--surface);
            padding: 10px 10px 8px 14px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
        }

        .composer {
            display: block;
            width: 100%;
            max-height: 180px;
            resize: none;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--text);
            line-height: 1.45;
        }

        .composer::placeholder {
            color: #9a9a9a;
        }

        .composer-actions {
            display: flex;
            min-height: 29px;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 6px;
        }

        .composer-hint {
            color: var(--muted);
            font-size: 11px;
        }

        .send-button {
            display: grid;
            width: 30px;
            height: 30px;
            place-items: center;
            border: 0;
            border-radius: 999px;
            background: var(--text);
            color: #202020;
            font-size: 16px;
            font-weight: 800;
        }

        .send-button:hover {
            background: white;
        }

        .send-button[disabled] {
            cursor: default;
            opacity: 0.42;
        }

        .cancel-button {
            border: 1px solid var(--border);
            border-radius: 999px;
            background: transparent;
            color: var(--muted-strong);
            padding: 5px 9px;
            font-size: 11px;
        }

        .inspector {
            min-width: 0;
            overflow-y: auto;
            border-left: 1px solid var(--border-soft);
            padding: 16px 14px;
        }

        .inspector-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
        }

        .inspector-title {
            margin: 0;
            font-size: 14px;
            font-weight: 700;
        }

        .run-summary {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px;
            margin-bottom: 18px;
        }

        .summary-card {
            min-width: 0;
            border: 1px solid var(--border-soft);
            border-radius: 9px;
            background: #202020;
            padding: 9px;
        }

        .summary-name {
            color: var(--muted);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .summary-value {
            margin-top: 4px;
            overflow: hidden;
            color: var(--text);
            font-size: 13px;
            font-weight: 650;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .plan-empty {
            margin-top: 11px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.5;
        }

        .plan-list {
            margin-top: 12px;
        }

        .plan-step {
            position: relative;
            min-height: 67px;
            margin-left: 9px;
            border-left: 1px solid #424242;
            padding: 0 0 17px 18px;
        }

        .plan-step:last-child {
            min-height: 0;
            border-left-color: transparent;
        }

        .step-dot {
            position: absolute;
            top: 0;
            left: -7px;
            width: 13px;
            height: 13px;
            border: 2px solid var(--panel);
            border-radius: 999px;
            background: #686868;
        }

        .plan-step.complete .step-dot {
            background: var(--accent);
        }

        .plan-step.running .step-dot {
            background: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.18);
        }

        .plan-step.approval .step-dot {
            background: var(--warning);
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15);
        }

        .plan-step.stopped .step-dot {
            background: var(--danger);
        }

        .step-agent {
            color: var(--muted-strong);
            font-size: 11px;
            font-weight: 750;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .step-task {
            margin-top: 4px;
            color: var(--text);
            font-size: 12px;
            line-height: 1.45;
        }

        .step-status {
            margin-top: 4px;
            color: var(--muted);
            font-size: 11px;
        }

        .overlay {
            display: none;
        }

        .toast {
            position: fixed;
            right: 18px;
            bottom: 18px;
            z-index: 30;
            max-width: 340px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #303030;
            padding: 10px 12px;
            color: var(--text);
            font-size: 12px;
            box-shadow: 0 9px 30px rgba(0, 0, 0, 0.35);
        }

        @media (max-width: 1100px) {
            .app-shell {
                grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
            }

            .inspector {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                z-index: 22;
                width: min(var(--inspector-width), calc(100vw - 40px));
                transform: translateX(100%);
                transition: transform 180ms ease;
            }

            .inspector.open {
                transform: translateX(0);
            }

            .details-button {
                display: grid;
            }
        }

        @media (max-width: 720px) {
            .app-shell {
                display: block;
            }

            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 22;
                width: min(var(--sidebar-width), calc(100vw - 40px));
                transform: translateX(-100%);
                transition: transform 180ms ease;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-only {
                display: grid;
            }

            .gateway-label {
                display: none;
            }

            .message {
                padding: 14px 16px;
            }

            .user .message-content {
                max-width: 88%;
            }

            .composer-wrap {
                padding: 9px 10px 11px;
            }

            .overlay.open {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 20;
                background: rgba(0, 0, 0, 0.48);
            }
        }

        @media (max-width: 520px) {
            .examples {
                grid-template-columns: 1fr;
            }

            .composer-hint {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-mark">A</div>
                    <span>Agent Playground</span>
                </div>
                <button class="new-chat" id="newChatButton" type="button">
                    <span class="plus">+</span>
                    <span>New chat</span>
                </button>
            </div>

            <div class="search-wrap">
                <input class="search-input" id="historySearch" type="search" placeholder="Search local chats">
            </div>

            <div class="history-label">Local history</div>
            <div class="session-list" id="sessionList"></div>

            <div class="sidebar-footer">
                <button class="sidebar-action" id="settingsButton" type="button">
                    <span>Settings</span>
                </button>
                <div class="settings-panel" id="settingsPanel">
                    <label class="settings-label" for="gatewayUrl">Gateway URL</label>
                    <input class="settings-input" id="gatewayUrl" type="url" autocomplete="url">

                    <label class="settings-label" for="apiKey">API key</label>
                    <div class="key-row">
                        <input class="settings-input" id="apiKey" type="password" autocomplete="current-password" placeholder="Bearer token">
                        <button class="key-toggle" id="keyToggle" type="button" aria-label="Show API key">Show</button>
                    </div>

                    <label class="remember-row">
                        <input id="rememberKey" type="checkbox">
                        <span>Remember key in this browser</span>
                    </label>

                    <div class="settings-actions">
                        <button class="primary-button" id="saveSettings" type="button">Save</button>
                        <button class="secondary-button" id="checkGateway" type="button">Check</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <header class="chat-header">
                <button class="icon-button mobile-only" id="menuButton" type="button" aria-label="Open chats">Menu</button>
                <div class="header-title">
                    <div class="chat-title" id="chatTitle">New chat</div>
                    <div class="session-id" id="sessionId">Local draft</div>
                </div>
                <div class="gateway-pill" title="Gateway health">
                    <span class="health-dot" id="healthDot"></span>
                    <span class="gateway-label" id="healthText">Checking gateway</span>
                </div>
                <button class="icon-button details-button mobile-only" id="detailsButton" type="button" aria-label="Open execution plan">Plan</button>
            </header>

            <section class="messages" id="messages" aria-live="polite"></section>

            <div class="composer-wrap">
                <div class="composer-box">
                    <textarea class="composer" id="composer" rows="1" placeholder="Message the agent platform"></textarea>
                    <div class="composer-actions">
                        <span class="composer-hint">Enter to send, Shift+Enter for a new line</span>
                        <div id="composerAction"></div>
                    </div>
                </div>
            </div>
        </main>

        <aside class="inspector" id="inspector">
            <div class="inspector-header">
                <h2 class="inspector-title">Execution plan</h2>
                <button class="icon-button mobile-only" id="closeDetailsButton" type="button" aria-label="Close execution plan">Close</button>
            </div>
            <div id="runInspector"></div>
        </aside>
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="toastHost"></div>

    <script>
        (() => {
            "use strict";

            const STORAGE = {
                sessions: "agent-playground.sessions.v1",
                config: "agent-playground.config.v1",
                rememberedKey: "agent-playground.api-key.v1",
                sessionKey: "agent-playground.session-key.v1"
            };
            const CRITICAL_AGENTS = new Set(["tool", "devops", "computer_use"]);
            const DEFAULT_GATEWAY = "http://localhost:8000";
            const examples = [
                "Summarize the platform architecture from the available documentation.",
                "Check the latest deployment status and explain any failures.",
                "Find the runbook for a high CPU incident.",
                "Draft an incident report for the current API outage."
            ];

            const elements = {
                apiKey: document.getElementById("apiKey"),
                chatTitle: document.getElementById("chatTitle"),
                checkGateway: document.getElementById("checkGateway"),
                closeDetailsButton: document.getElementById("closeDetailsButton"),
                composer: document.getElementById("composer"),
                composerAction: document.getElementById("composerAction"),
                detailsButton: document.getElementById("detailsButton"),
                gatewayUrl: document.getElementById("gatewayUrl"),
                healthDot: document.getElementById("healthDot"),
                healthText: document.getElementById("healthText"),
                historySearch: document.getElementById("historySearch"),
                inspector: document.getElementById("inspector"),
                keyToggle: document.getElementById("keyToggle"),
                menuButton: document.getElementById("menuButton"),
                messages: document.getElementById("messages"),
                newChatButton: document.getElementById("newChatButton"),
                overlay: document.getElementById("overlay"),
                rememberKey: document.getElementById("rememberKey"),
                runInspector: document.getElementById("runInspector"),
                saveSettings: document.getElementById("saveSettings"),
                sessionId: document.getElementById("sessionId"),
                sessionList: document.getElementById("sessionList"),
                settingsButton: document.getElementById("settingsButton"),
                settingsPanel: document.getElementById("settingsPanel"),
                sidebar: document.getElementById("sidebar"),
                toastHost: document.getElementById("toastHost")
            };

            const state = {
                activeSessionId: null,
                config: loadConfig(),
                controller: null,
                loading: false,
                sessions: loadSessions()
            };

            function generateId() {
                if (window.crypto && typeof window.crypto.randomUUID === "function") {
                    return window.crypto.randomUUID();
                }
                return `local-${Date.now()}-${Math.random().toString(16).slice(2)}`;
            }

            function loadConfig() {
                try {
                    const stored = JSON.parse(localStorage.getItem(STORAGE.config) || "{}");
                    return {
                        baseUrl: String(stored.baseUrl || DEFAULT_GATEWAY).replace(/\/+$/, ""),
                        rememberApiKey: Boolean(stored.rememberApiKey)
                    };
                } catch {
                    return { baseUrl: DEFAULT_GATEWAY, rememberApiKey: false };
                }
            }

            function loadSessions() {
                try {
                    const stored = JSON.parse(localStorage.getItem(STORAGE.sessions) || "[]");
                    return Array.isArray(stored) ? stored : [];
                } catch {
                    return [];
                }
            }

            function persistSessions() {
                localStorage.setItem(STORAGE.sessions, JSON.stringify(state.sessions));
            }

            function getApiKey() {
                if (state.config.rememberApiKey) {
                    return localStorage.getItem(STORAGE.rememberedKey) || "";
                }
                return sessionStorage.getItem(STORAGE.sessionKey) || "";
            }

            function activeSession() {
                return state.sessions.find(session => session.id === state.activeSessionId);
            }

            function createLocalSession() {
                const now = new Date().toISOString();
                const session = {
                    id: generateId(),
                    remoteSessionId: null,
                    title: "New chat",
                    createdAt: now,
                    updatedAt: now,
                    approvedTaskIds: [],
                    messages: [],
                    lastExecution: null
                };
                state.sessions.unshift(session);
                state.activeSessionId = session.id;
                persistSessions();
                render();
                return session;
            }

            function ensureActiveSession() {
                return activeSession() || createLocalSession();
            }

            function updateSessionTimestamp(session) {
                session.updatedAt = new Date().toISOString();
            }

            function titleFromPrompt(prompt) {
                const normalized = prompt.replace(/\s+/g, " ").trim();
                return normalized.length > 46 ? `${normalized.slice(0, 46)}...` : normalized;
            }

            function setSettingsOpen(open) {
                elements.settingsPanel.classList.toggle("open", open);
            }

            function closeDrawers() {
                elements.sidebar.classList.remove("open");
                elements.inspector.classList.remove("open");
                elements.overlay.classList.remove("open");
            }

            function showToast(message) {
                const toast = document.createElement("div");
                toast.className = "toast";
                toast.textContent = message;
                elements.toastHost.replaceChildren(toast);
                window.setTimeout(() => {
                    if (toast.parentNode) {
                        toast.remove();
                    }
                }, 3200);
            }

            function render() {
                const session = ensureActiveSession();
                renderSessionList();
                renderHeader(session);
                renderMessages(session);
                renderInspector(session);
                renderComposerAction();
            }

            function renderSessionList() {
                const query = elements.historySearch.value.trim().toLowerCase();
                const sorted = [...state.sessions].sort((a, b) => {
                    return String(b.updatedAt).localeCompare(String(a.updatedAt));
                });
                const visible = sorted.filter(session => {
                    return !query || String(session.title).toLowerCase().includes(query);
                });

                const fragment = document.createDocumentFragment();
                for (const session of visible) {
                    const item = document.createElement("div");
                    item.className = `session-item${session.id === state.activeSessionId ? " active" : ""}`;

                    const select = document.createElement("button");
                    select.type = "button";
                    select.className = "session-select";
                    select.textContent = session.title || "New chat";
                    select.addEventListener("click", () => {
                        state.activeSessionId = session.id;
                        closeDrawers();
                        render();
                    });

                    const remove = document.createElement("button");
                    remove.type = "button";
                    remove.className = "session-delete";
                    remove.setAttribute("aria-label", `Delete ${session.title || "chat"}`);
                    remove.textContent = "x";
                    remove.addEventListener("click", event => {
                        event.stopPropagation();
                        deleteSession(session.id);
                    });

                    item.append(select, remove);
                    fragment.append(item);
                }
                elements.sessionList.replaceChildren(fragment);
            }

            function deleteSession(sessionId) {
                state.sessions = state.sessions.filter(session => session.id !== sessionId);
                if (state.activeSessionId === sessionId) {
                    state.activeSessionId = state.sessions[0]?.id || null;
                }
                if (!state.sessions.length) {
                    createLocalSession();
                    return;
                }
                persistSessions();
                render();
            }

            function renderHeader(session) {
                elements.chatTitle.textContent = session.title || "New chat";
                elements.sessionId.textContent = session.remoteSessionId
                    ? `Session ${shortId(session.remoteSessionId)}`
                    : "Local draft";
            }

            function shortId(value) {
                const text = String(value || "");
                return text.length > 18 ? `${text.slice(0, 8)}...${text.slice(-6)}` : text;
            }

            function renderMessages(session) {
                if (!session.messages.length && !state.loading) {
                    elements.messages.replaceChildren(buildEmptyState());
                    return;
                }

                const fragment = document.createDocumentFragment();
                for (const message of session.messages) {
                    fragment.append(buildMessage(message, session));
                }
                if (state.loading) {
                    fragment.append(buildLoadingMessage());
                }
                elements.messages.replaceChildren(fragment);
                window.requestAnimationFrame(() => {
                    elements.messages.scrollTop = elements.messages.scrollHeight;
                });
            }

            function buildEmptyState() {
                const outer = document.createElement("div");
                outer.className = "empty-state";
                const inner = document.createElement("div");
                inner.className = "empty-inner";
                const mark = document.createElement("div");
                mark.className = "empty-mark";
                mark.textContent = "A";
                const title = document.createElement("h1");
                title.className = "empty-title";
                title.textContent = "How can the agents help?";
                const copy = document.createElement("p");
                copy.className = "empty-copy";
                copy.textContent = "Send a task to the Gateway. The execution plan and timing will appear alongside the conversation.";
                const exampleGrid = document.createElement("div");
                exampleGrid.className = "examples";
                for (const text of examples) {
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "example";
                    button.textContent = text;
                    button.addEventListener("click", () => {
                        elements.composer.value = text;
                        resizeComposer();
                        elements.composer.focus();
                    });
                    exampleGrid.append(button);
                }
                inner.append(mark, title, copy, exampleGrid);
                outer.append(inner);
                return outer;
            }

            function buildMessage(message, session) {
                const row = document.createElement("article");
                row.className = `message ${message.role}`;
                const content = document.createElement("div");
                content.className = "message-content";

                if (message.role === "assistant") {
                    content.classList.add("markdown");
                    content.append(renderMarkdown(message.content));
                } else {
                    content.textContent = message.content;
                }

                if (message.execution) {
                    const meta = document.createElement("div");
                    meta.className = "message-meta";
                    const label = document.createElement("strong");
                    label.textContent = "Execution";
                    const time = document.createElement("span");
                    time.textContent = formatSeconds(message.execution.executionTime);
                    meta.append(label, time);
                    content.append(meta);
                }

                if (message.approval) {
                    content.append(buildApprovalCard(message.approval, session));
                }

                if (message.role === "error" && message.retryPrompt) {
                    const retry = document.createElement("button");
                    retry.type = "button";
                    retry.className = "secondary-button";
                    retry.textContent = "Retry request";
                    retry.style.marginTop = "10px";
                    retry.addEventListener("click", () => runExecution(message.retryPrompt, { appendUser: false }));
                    content.append(retry);
                }

                row.append(content);
                return row;
            }

            function buildLoadingMessage() {
                const row = document.createElement("article");
                row.className = "message assistant";
                const content = document.createElement("div");
                content.className = "loading-row";
                const dots = document.createElement("div");
                dots.className = "loading-dots";
                dots.append(document.createElement("span"), document.createElement("span"), document.createElement("span"));
                const label = document.createElement("span");
                label.textContent = "Gateway is orchestrating the request...";
                content.append(dots, label);
                row.append(content);
                return row;
            }

            function buildApprovalCard(approval, session) {
                const card = document.createElement("div");
                card.className = "approval-card";
                const title = document.createElement("div");
                title.className = "approval-title";
                title.textContent = "Operator approval required";
                const copy = document.createElement("p");
                copy.className = "approval-copy";
                copy.textContent = approval.taskIds.length
                    ? "Approve the guarded task in this session, then rerun the original request."
                    : "The response is waiting for approval, but it did not include a task id.";
                const actions = document.createElement("div");
                actions.className = "approval-actions";

                for (const taskId of approval.taskIds) {
                    const approved = session.approvedTaskIds.includes(taskId);
                    const button = document.createElement("button");
                    button.type = "button";
                    button.className = "approval-button";
                    button.disabled = approved || state.loading;
                    button.textContent = approved ? `${taskId} approved` : `Approve ${taskId} & retry`;
                    button.addEventListener("click", () => approveAndRetry(taskId, approval.prompt));
                    actions.append(button);
                }

                card.append(title, copy);
                if (approval.taskIds.length) {
                    card.append(actions);
                }
                return card;
            }

            function renderInspector(session) {
                const execution = session.lastExecution;
                const fragment = document.createDocumentFragment();
                const summary = document.createElement("div");
                summary.className = "run-summary";
                summary.append(
                    buildSummaryCard("Status", execution ? formatStatus(execution.status) : "Idle"),
                    buildSummaryCard("Run time", execution ? formatSeconds(execution.executionTime) : "-"),
                    buildSummaryCard("Steps", execution?.plan?.tasks?.length ?? "-"),
                    buildSummaryCard("Session", session.remoteSessionId ? shortId(session.remoteSessionId) : "Draft")
                );
                fragment.append(summary);

                const label = document.createElement("div");
                label.className = "inspector-label";
                label.textContent = "Agent steps";
                fragment.append(label);

                const tasks = execution?.plan?.tasks;
                if (!Array.isArray(tasks) || !tasks.length) {
                    const empty = document.createElement("div");
                    empty.className = "plan-empty";
                    empty.textContent = state.loading
                        ? "Waiting for the manager agent to return an execution plan."
                        : "Run a request to inspect the manager plan and selected agents.";
                    fragment.append(empty);
                    elements.runInspector.replaceChildren(fragment);
                    return;
                }

                const list = document.createElement("div");
                list.className = "plan-list";
                tasks.forEach((task, index) => {
                    const status = stepStatus(task, index, execution);
                    const step = document.createElement("div");
                    step.className = `plan-step ${status}`;
                    const dot = document.createElement("div");
                    dot.className = "step-dot";
                    const agent = document.createElement("div");
                    agent.className = "step-agent";
                    agent.textContent = `${task.agent || "agent"} / ${task.id || `task-${index + 1}`}`;
                    const instruction = document.createElement("div");
                    instruction.className = "step-task";
                    instruction.textContent = task.instruction || "No task instruction";
                    const stateLabel = document.createElement("div");
                    stateLabel.className = "step-status";
                    stateLabel.textContent = formatStatus(status);
                    step.append(dot, agent, instruction, stateLabel);
                    list.append(step);
                });
                fragment.append(list);
                elements.runInspector.replaceChildren(fragment);
            }

            function buildSummaryCard(name, value) {
                const card = document.createElement("div");
                card.className = "summary-card";
                const label = document.createElement("div");
                label.className = "summary-name";
                label.textContent = name;
                const content = document.createElement("div");
                content.className = "summary-value";
                content.textContent = String(value);
                card.append(label, content);
                return card;
            }

            function stepStatus(task, index, execution) {
                if (execution.approval?.taskIds?.includes(task.id)) {
                    return "approval";
                }
                if (execution.status === "loading") {
                    return index === 0 ? "running" : "queued";
                }
                if (execution.status === "error") {
                    return "stopped";
                }
                return "complete";
            }

            function formatStatus(value) {
                const normalized = String(value || "").replace(/[_-]+/g, " ");
                return normalized.charAt(0).toUpperCase() + normalized.slice(1);
            }

            function formatSeconds(value) {
                const seconds = Number(value);
                if (!Number.isFinite(seconds)) {
                    return "-";
                }
                return `${seconds.toFixed(seconds >= 10 ? 1 : 2)}s`;
            }

            function renderComposerAction() {
                const button = document.createElement("button");
                if (state.loading) {
                    button.type = "button";
                    button.className = "cancel-button";
                    button.textContent = "Cancel";
                    button.addEventListener("click", cancelRequest);
                } else {
                    button.type = "button";
                    button.className = "send-button";
                    button.setAttribute("aria-label", "Send message");
                    button.textContent = "↑";
                    button.disabled = !elements.composer.value.trim();
                    button.addEventListener("click", handleSend);
                }
                elements.composerAction.replaceChildren(button);
            }

            function resizeComposer() {
                elements.composer.style.height = "auto";
                elements.composer.style.height = `${Math.min(elements.composer.scrollHeight, 180)}px`;
                renderComposerAction();
            }

            function handleSend() {
                const prompt = elements.composer.value.trim();
                if (!prompt || state.loading) {
                    return;
                }
                elements.composer.value = "";
                resizeComposer();
                runExecution(prompt, { appendUser: true });
            }

            async function runExecution(prompt, { appendUser }) {
                if (state.loading) {
                    return;
                }
                const apiKey = getApiKey();
                if (!apiKey) {
                    setSettingsOpen(true);
                    showToast("Add a Gateway API key before sending a request.");
                    elements.apiKey.focus();
                    return;
                }

                const session = ensureActiveSession();
                if (appendUser) {
                    session.messages.push({
                        id: generateId(),
                        role: "user",
                        content: prompt,
                        createdAt: new Date().toISOString()
                    });
                    if (session.title === "New chat") {
                        session.title = titleFromPrompt(prompt);
                    }
                }

                updateSessionTimestamp(session);
                state.loading = true;
                state.controller = new AbortController();
                session.lastExecution = { status: "loading", plan: null, executionTime: null, approval: null };
                persistSessions();
                render();

                try {
                    await ensureGatewaySession(session, apiKey);
                    const response = await apiRequest("/execute", {
                        method: "POST",
                        apiKey,
                        body: {
                            user_input: prompt,
                            session_id: session.remoteSessionId
                        },
                        signal: state.controller.signal
                    });
                    const approval = findAwaitingApproval(response, response.plan, prompt);
                    const executionStatus = response.status === "error" || response.error ? "error" : "success";
                    const execution = {
                        status: approval ? "awaiting_approval" : executionStatus,
                        plan: response.plan || null,
                        executionTime: response.execution_time_seconds,
                        approval
                    };
                    session.lastExecution = execution;
                    session.messages.push({
                        id: generateId(),
                        role: executionStatus === "error" && !response.result ? "error" : "assistant",
                        content: response.result || response.error || "The Gateway completed without a text response.",
                        createdAt: new Date().toISOString(),
                        execution,
                        approval,
                        retryPrompt: prompt
                    });
                } catch (error) {
                    const cancelled = error.name === "AbortError";
                    session.lastExecution = {
                        status: cancelled ? "cancelled" : "error",
                        plan: session.lastExecution?.plan || null,
                        executionTime: null,
                        approval: null
                    };
                    session.messages.push({
                        id: generateId(),
                        role: cancelled ? "system" : "error",
                        content: cancelled ? "Request cancelled." : error.message,
                        createdAt: new Date().toISOString(),
                        retryPrompt: cancelled ? null : prompt
                    });
                } finally {
                    state.loading = false;
                    state.controller = null;
                    updateSessionTimestamp(session);
                    persistSessions();
                    render();
                }
            }

            async function ensureGatewaySession(session, apiKey) {
                if (session.remoteSessionId) {
                    return;
                }
                const response = await apiRequest("/session", {
                    method: "POST",
                    apiKey,
                    signal: state.controller?.signal
                });
                if (!response.session_id) {
                    throw new Error("Gateway did not return a session id.");
                }
                session.remoteSessionId = response.session_id;
                persistSessions();
            }

            async function approveAndRetry(taskId, prompt) {
                if (state.loading) {
                    return;
                }
                const session = ensureActiveSession();
                const apiKey = getApiKey();
                if (!apiKey || !session.remoteSessionId) {
                    showToast("The Gateway session is not ready for approval.");
                    return;
                }

                try {
                    await apiRequest(`/session/${encodeURIComponent(session.remoteSessionId)}/approve-task/${encodeURIComponent(taskId)}`, {
                        method: "POST",
                        apiKey
                    });
                    if (!session.approvedTaskIds.includes(taskId)) {
                        session.approvedTaskIds.push(taskId);
                    }
                    session.messages.push({
                        id: generateId(),
                        role: "system",
                        content: `Approved task ${taskId}. Retrying the original request.`,
                        createdAt: new Date().toISOString()
                    });
                    updateSessionTimestamp(session);
                    persistSessions();
                    render();
                    await runExecution(prompt, { appendUser: false });
                } catch (error) {
                    showToast(`Approval failed: ${error.message}`);
                }
            }

            function cancelRequest() {
                state.controller?.abort();
            }

            async function apiRequest(path, { method = "GET", apiKey = "", body, signal } = {}) {
                const headers = {};
                if (apiKey) {
                    headers.Authorization = `Bearer ${apiKey}`;
                }
                if (body !== undefined) {
                    headers["Content-Type"] = "application/json";
                }
                const response = await fetch(`${state.config.baseUrl}${path}`, {
                    method,
                    headers,
                    body: body === undefined ? undefined : JSON.stringify(body),
                    signal
                });
                let payload = null;
                try {
                    payload = await response.json();
                } catch {
                    payload = null;
                }
                if (!response.ok) {
                    const detail = payload?.detail || payload?.error || `${response.status} ${response.statusText}`;
                    throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
                }
                return payload || {};
            }

            function findAwaitingApproval(response, plan, prompt) {
                const taskIds = new Set();
                const pattern = /(awaiting[_\s-]*approval|requires?\s+(?:operator\s+)?approval|require[_\s-]*approval)/i;
                let detected = false;

                function walk(value, inheritedTaskId = null) {
                    if (typeof value === "string") {
                        if (pattern.test(value)) {
                            detected = true;
                            const match = value.match(/\btask[_-]?\d+\b/i);
                            if (match) {
                                taskIds.add(match[0]);
                            }
                            if (inheritedTaskId) {
                                taskIds.add(inheritedTaskId);
                            }
                        }
                        return;
                    }
                    if (!value || typeof value !== "object") {
                        return;
                    }
                    if (Array.isArray(value)) {
                        value.forEach(item => walk(item, inheritedTaskId));
                        return;
                    }

                    const localTaskId = value.task_id || value.taskId || inheritedTaskId;
                    const statusText = String(value.status || value.verdict || "");
                    if (
                        pattern.test(statusText) ||
                        value.requires_approval === true ||
                        value.requiresApproval === true
                    ) {
                        detected = true;
                        if (localTaskId) {
                            taskIds.add(String(localTaskId));
                        }
                    }
                    Object.values(value).forEach(child => walk(child, localTaskId));
                }

                walk(response);
                if (!detected) {
                    return null;
                }

                const tasks = Array.isArray(plan?.tasks) ? plan.tasks : [];
                if (!taskIds.size) {
                    const criticalTasks = tasks.filter(task => CRITICAL_AGENTS.has(String(task.agent).toLowerCase()));
                    if (criticalTasks.length) {
                        criticalTasks.forEach(task => taskIds.add(task.id));
                    } else if (tasks.length === 1) {
                        taskIds.add(tasks[0].id);
                    }
                }
                return {
                    prompt,
                    taskIds: [...taskIds].filter(Boolean)
                };
            }

            function renderMarkdown(markdown) {
                const fragment = document.createDocumentFragment();
                const lines = String(markdown || "").replace(/\r\n?/g, "\n").split("\n");
                let paragraph = [];
                let list = null;
                let code = null;

                function flushParagraph() {
                    if (!paragraph.length) {
                        return;
                    }
                    const node = document.createElement("p");
                    appendInlineMarkdown(node, paragraph.join(" "));
                    fragment.append(node);
                    paragraph = [];
                }

                function flushList() {
                    if (list) {
                        fragment.append(list.node);
                        list = null;
                    }
                }

                function flushCode() {
                    const pre = document.createElement("pre");
                    const node = document.createElement("code");
                    if (code.language) {
                        node.className = `language-${code.language.replace(/[^a-z0-9_-]/gi, "")}`;
                    }
                    node.textContent = code.lines.join("\n");
                    pre.append(node);
                    fragment.append(pre);
                    code = null;
                }

                for (const line of lines) {
                    const fence = line.match(/^```([\w-]*)\s*$/);
                    if (fence) {
                        flushParagraph();
                        flushList();
                        if (code) {
                            flushCode();
                        } else {
                            code = { language: fence[1], lines: [] };
                        }
                        continue;
                    }
                    if (code) {
                        code.lines.push(line);
                        continue;
                    }
                    if (!line.trim()) {
                        flushParagraph();
                        flushList();
                        continue;
                    }

                    const heading = line.match(/^(#{1,4})\s+(.+)$/);
                    const unordered = line.match(/^\s*[-*]\s+(.+)$/);
                    const ordered = line.match(/^\s*\d+\.\s+(.+)$/);
                    const quote = line.match(/^>\s?(.*)$/);
                    if (heading) {
                        flushParagraph();
                        flushList();
                        const node = document.createElement(`h${heading[1].length}`);
                        appendInlineMarkdown(node, heading[2]);
                        fragment.append(node);
                    } else if (unordered || ordered) {
                        flushParagraph();
                        const type = unordered ? "ul" : "ol";
                        if (!list || list.type !== type) {
                            flushList();
                            list = { type, node: document.createElement(type) };
                        }
                        const item = document.createElement("li");
                        appendInlineMarkdown(item, (unordered || ordered)[1]);
                        list.node.append(item);
                    } else if (quote) {
                        flushParagraph();
                        flushList();
                        const node = document.createElement("blockquote");
                        appendInlineMarkdown(node, quote[1]);
                        fragment.append(node);
                    } else if (/^\s*---+\s*$/.test(line)) {
                        flushParagraph();
                        flushList();
                        fragment.append(document.createElement("hr"));
                    } else {
                        paragraph.push(line);
                    }
                }

                flushParagraph();
                flushList();
                if (code) {
                    flushCode();
                }
                return fragment;
            }

            function appendInlineMarkdown(parent, text) {
                const pattern = /(`[^`]+`|\*\*[^*]+\*\*|\*[^*]+\*|\[[^\]]+\]\([^)]+\))/g;
                let index = 0;
                for (const match of text.matchAll(pattern)) {
                    if (match.index > index) {
                        parent.append(document.createTextNode(text.slice(index, match.index)));
                    }
                    const token = match[0];
                    if (token.startsWith("`")) {
                        const node = document.createElement("code");
                        node.textContent = token.slice(1, -1);
                        parent.append(node);
                    } else if (token.startsWith("**")) {
                        const node = document.createElement("strong");
                        appendInlineMarkdown(node, token.slice(2, -2));
                        parent.append(node);
                    } else if (token.startsWith("*")) {
                        const node = document.createElement("em");
                        appendInlineMarkdown(node, token.slice(1, -1));
                        parent.append(node);
                    } else {
                        const parts = token.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
                        const url = parts?.[2] || "";
                        if (isAllowedUrl(url)) {
                            const node = document.createElement("a");
                            node.href = url;
                            node.target = "_blank";
                            node.rel = "noopener noreferrer";
                            node.textContent = parts[1];
                            parent.append(node);
                        } else {
                            parent.append(document.createTextNode(parts?.[1] || token));
                        }
                    }
                    index = match.index + token.length;
                }
                if (index < text.length) {
                    parent.append(document.createTextNode(text.slice(index)));
                }
            }

            function isAllowedUrl(value) {
                try {
                    const url = new URL(value);
                    return ["http:", "https:", "mailto:"].includes(url.protocol);
                } catch {
                    return false;
                }
            }

            async function checkGatewayHealth() {
                elements.healthDot.className = "health-dot";
                elements.healthText.textContent = "Checking gateway";
                const controller = new AbortController();
                const timeout = window.setTimeout(() => controller.abort(), 3500);
                try {
                    await apiRequest("/health", { signal: controller.signal });
                    elements.healthDot.className = "health-dot online";
                    elements.healthText.textContent = "Gateway online";
                } catch {
                    elements.healthDot.className = "health-dot offline";
                    elements.healthText.textContent = "Gateway offline";
                } finally {
                    window.clearTimeout(timeout);
                }
            }

            function saveSettings() {
                const baseUrl = elements.gatewayUrl.value.trim().replace(/\/+$/, "");
                if (!/^https?:\/\//i.test(baseUrl)) {
                    showToast("Gateway URL must start with http:// or https://.");
                    return;
                }
                const apiKey = elements.apiKey.value.trim();
                state.config = {
                    baseUrl,
                    rememberApiKey: elements.rememberKey.checked
                };
                localStorage.setItem(STORAGE.config, JSON.stringify(state.config));
                if (state.config.rememberApiKey) {
                    localStorage.setItem(STORAGE.rememberedKey, apiKey);
                    sessionStorage.removeItem(STORAGE.sessionKey);
                } else {
                    sessionStorage.setItem(STORAGE.sessionKey, apiKey);
                    localStorage.removeItem(STORAGE.rememberedKey);
                }
                showToast("Gateway settings saved.");
                checkGatewayHealth();
            }

            function initializeSettings() {
                elements.gatewayUrl.value = state.config.baseUrl;
                elements.rememberKey.checked = state.config.rememberApiKey;
                elements.apiKey.value = getApiKey();
            }

            elements.newChatButton.addEventListener("click", () => {
                createLocalSession();
                closeDrawers();
                elements.composer.focus();
            });
            elements.historySearch.addEventListener("input", renderSessionList);
            elements.settingsButton.addEventListener("click", () => {
                setSettingsOpen(!elements.settingsPanel.classList.contains("open"));
            });
            elements.saveSettings.addEventListener("click", saveSettings);
            elements.checkGateway.addEventListener("click", checkGatewayHealth);
            elements.keyToggle.addEventListener("click", () => {
                const hidden = elements.apiKey.type === "password";
                elements.apiKey.type = hidden ? "text" : "password";
                elements.keyToggle.textContent = hidden ? "Hide" : "Show";
            });
            elements.composer.addEventListener("input", resizeComposer);
            elements.composer.addEventListener("keydown", event => {
                if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
                    event.preventDefault();
                    handleSend();
                }
            });
            elements.menuButton.addEventListener("click", () => {
                elements.sidebar.classList.add("open");
                elements.overlay.classList.add("open");
            });
            elements.detailsButton.addEventListener("click", () => {
                elements.inspector.classList.add("open");
                elements.overlay.classList.add("open");
            });
            elements.closeDetailsButton.addEventListener("click", closeDrawers);
            elements.overlay.addEventListener("click", closeDrawers);

            initializeSettings();
            if (!state.sessions.length) {
                createLocalSession();
            } else {
                state.activeSessionId = state.sessions[0].id;
                render();
            }
            checkGatewayHealth();
        })();
    </script>
</body>
</html>
